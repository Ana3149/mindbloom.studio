      },

        ctaSecondary: "Fazer Quiz Gratuito de Prontidão",
        founderBadge: "10 Anos na Alemanha",
        founderTitle: "Fundado por Ana Paula Kretschmar",
        founderBio: "Após viver 10 anos na Alemanha, vivi na pele o silêncio da crise imobiliária, a burocracia implacável e as regras rígidas de tradução de laudos e remédios controlados. Eu não vendo falsos milagres ou chaves garantidas — eu entrego o mapa operacional exato, rede de parceiros auditados e clareza estratégica para proteger sua saúde mental.",

          "Sessão Estratégica 1 a 1 de Alinhamento e Análise de Dossiê",

        sslNote: "Checkout criptografado (SSL)",
        termsPrefix: "Ao pagar, você concorda com os nossos",
        termsLink: "Termos de Serviço",
        termsAnd: "e com a",
        privacyLink: "Política de Privacidade",
        termsLinkShort: "Termos",
        privacyLinkShort: "Privacidade",
        disclaimer: "Aviso Legal: Não garantimos a obtenção de imóveis nem atuamos como imobiliária. Fornecemos orientação estratégica profissional, estruturação de documentos e indicações de especialistas baseadas em 10 anos de vivência na Alemanha.",

        quizQ1: "Você possui documentos organizados e reservas financeiras para pelo menos 3 meses de transição?",
        quizYes: "Sim, totalmente preparado",
        quizNo: "Ainda estou organizando",
        quizCta: "Garantir Minha Vaga VIP",
        resultReady: "Você tem uma base sólida! Nossa Consultoria VIP pode acelerar sua chegada com segurança.",
        resultWork: "Você precisa do nosso roadmap estratégico antes de arrumar as malas. Vamos guiar sua burocracia."
      }
    };

    let lang = 'en';
    let quizScore = 0;

    const checkIcon = '<svg class="w-6 h-6 text-[#8C4A32] shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>';

    function render() {
      const t = content[lang];
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const value = t[el.dataset.i18n];
        if (typeof value === 'string') el.textContent = value;
      });

      const grid = document.getElementById('featuresGrid');
      grid.innerHTML = '';
      t.features.forEach(feature => {
        const card = document.createElement('div');
        card.className = 'bg-white p-6 rounded-xl border border-[#E6E0D5] shadow-sm flex items-start gap-4';
        card.innerHTML = checkIcon;
        const p = document.createElement('p');
        p.className = 'text-sm md:text-base text-[#3A3633] leading-relaxed';
        p.textContent = feature;
        card.appendChild(p);
        grid.appendChild(card);
      });

      renderQuizResult(false);
    }

    function renderQuizResult(animate) {
      const box = document.getElementById('quizResult');
      if (quizScore === 0) { box.classList.add('hidden'); return; }
      const t = content[lang];
      document.getElementById('quizResultText').textContent = quizScore === 2 ? t.resultReady : t.resultWork;
      box.classList.remove('hidden');
      if (animate) {
        box.classList.remove('animate-fadeIn');
        void box.offsetWidth; // restart animation
        box.classList.add('animate-fadeIn');
      }
    }

    function answerQuiz(score, btn) {
      quizScore = score;
      document.querySelectorAll('.quiz-option').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
      renderQuizResult(true);
    }

    function toggleLanguage() {
      lang = lang === 'en' ? 'pt' : 'en';
      render();
    }

    render();
  </script>
</body>
</html>
